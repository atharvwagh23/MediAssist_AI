[project]
name = "mediassist-ai"
version = "0.1.0"
description = "MediAssist AI: enterprise healthcare agentic AI copilot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Frontend and backend
    "streamlit",
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "requests",
    "pydantic",
    "python-dotenv",
    # Agents and LLM
    "langchain-core",
    "langchain-text-splitters",
    "langchain-groq",
    "langchain-openai",
    "langgraph",
    "langsmith",
    # RAG
    "pypdf",
    "python-docx",
    "sentence-transformers",
    "faiss-cpu",
    "rank-bm25",
    "numpy",
    # MCP and PostgreSQL
    "mcp<2",
    "psycopg2-binary",
    # Multimodal
    "easyocr",
    "transformers",
    "torch",
    "pillow",
    # Security and dashboard
    "bcrypt",
    "pandas",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]