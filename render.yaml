services:
  - type: web
    name: mediassist-ai
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      # secrets: Render asks you to type these in the dashboard (never commit them)
      - key: GROQ_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      # settings
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: JUDGE_MODEL
        value: openai/gpt-oss-120b
      - key: DB_SSLMODE
        value: require
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: MediAssist_AI
      # keep memory low on the 512 MB free tier
      - key: WARM_UP
        value: "false"
      - key: VISION_MODE
        value: "off"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
